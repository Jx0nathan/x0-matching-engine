[package]
name = "matching-core"
version = "0.2.0"
edition = "2021"

[dependencies]
bincode = "1.3.3"  # 快照、状态序列化
disruptor = "3.6.1"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
anyhow = "1.0.86"

# rkyv 用于 WAL 高性能序列化
rkyv = { version = "0.7", default-features = false, features = ["alloc", "size_64", "std", "validation"] }

# 性能优化
smallvec = { version = "1.13", features = ["serde"] }

# 日志
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tracing-appender = "0.2.3" # 异步日志

# 高性能对象池 (替代 Eclipse Collections 中的 Pool)
slab = { version = "0.4.9", features = ["serde"] }
# 快速哈希算法 (替代标准库默认 Hash)
ahash = { version = "0.8.12", features = ["serde"] }

# SIMD 向量化优化
wide = "0.7.28"

# 撮合是延迟敏感的热路径，跨 crate 内联收益明显；默认 release 不开 LTO、
# codegen-units 还是 16，等于把这部分收益丢掉了。
# 不设 panic="abort"：结算路径上的 expect 需要保留 unwind，
# 以便后续在 Disruptor handler 外层用 catch_unwind 兜住消费者线程。
[profile.release]
lto = "fat"
codegen-units = 1

# bench 必须和 release 同档，否则测出来的数字不代表生产表现
[profile.bench]
lto = "fat"
codegen-units = 1

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "exchange_bench"
harness = false

[[bench]]
name = "orderbook_optimized_bench"
harness = false